<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正多角形で円周率をはさみうちせよ</title>

<style>

body{
font-family:sans-serif;
background:#f5f7fa;
text-align:center;
margin:0;
padding:10px;
}

h1{
color:#204060;
}

.panel{
background:white;
padding:15px;
margin:10px auto;
max-width:900px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

canvas{
background:white;
border:1px solid #ccc;
max-width:100%;
}

button{
font-size:18px;
padding:8px 15px;
margin:5px;
}

.step{
font-size:22px;
font-weight:bold;
color:#204060;
}

.success{
color:green;
font-weight:bold;
font-size:28px;
}

.warning{
color:#d35400;
font-weight:bold;
}

</style>
</head>

<body>

<h1>東大を超えろ！</h1>

<div class="panel">

<h2>正多角形で円周率をはさみうちせよ</h2>

<p>

Mission A

<br>

π ＞ 3.05

</p>

<p>

Mission B

<br>

π ＜ 3.25

</p>

</div>

<div class="panel">

<button onclick="prevStep()">◀</button>

<span class="step" id="stepLabel"></span>

<button onclick="nextStep()">▶</button>

</div>

<div class="panel">

<button onclick="mode='inner';draw()">内接正多角形</button>

<button onclick="mode='outer';draw()">外接正多角形</button>

</div>

<div class="panel">

<button onclick="n=Math.max(3,n-1);draw()">－</button>

<span id="nLabel"></span>

<button onclick="n=Math.min(30,n+1);draw()">＋</button>

</div>

<div class="panel">

<canvas
id="canvas"
width="700"
height="700">
</canvas>

</div>

<div class="panel" id="message"></div>

<script>

let n=6;
let step=1;

let mode="inner";

const canvas=
document.getElementById("canvas");

const ctx=
canvas.getContext("2d");

function nextStep(){
if(step<7){
step++;
draw();
}
}

function prevStep(){
if(step>1){
step--;
draw();
}
}

function draw(){

ctx.clearRect(0,0,700,700);

document.getElementById("nLabel")
.innerHTML=
"n = "+n;

let cx=350;
let cy=350;

let R=250;

ctx.beginPath();
ctx.arc(cx,cy,R,0,2*Math.PI);

ctx.strokeStyle="#999";
ctx.stroke();

let msg="";
let stepText="";

if(mode==="inner"){

const pts=[];

for(let i=0;i<n;i++){

let t=
-Math.PI/2+
2*Math.PI*i/n;

pts.push({

x:cx+R*Math.cos(t),
y:cy+R*Math.sin(t)

});

}

ctx.beginPath();
ctx.moveTo(pts[0].x,pts[0].y);

for(let i=1;i<n;i++){

ctx.lineTo(
pts[i].x,
pts[i].y
);

}

ctx.closePath();

ctx.strokeStyle="blue";
ctx.lineWidth=2;
ctx.stroke();

if(step>=4){

ctx.beginPath();

ctx.moveTo(
pts[0].x,
pts[0].y
);

ctx.lineTo(
pts[1].x,
pts[1].y
);

ctx.strokeStyle="red";
ctx.lineWidth=6;
ctx.stroke();
}

if(step>=5){

ctx.beginPath();
ctx.moveTo(cx,cy);
ctx.lineTo(pts[0].x,pts[0].y);

ctx.strokeStyle="green";
ctx.stroke();

ctx.beginPath();
ctx.moveTo(cx,cy);
ctx.lineTo(pts[1].x,pts[1].y);
ctx.stroke();
}

let side=
Math.sqrt(
2-2*Math.cos(
2*Math.PI/n
)
);

let lower=n*side/2;

if(step===1){

stepText="STEP1";

msg=
"正多角形は円の内側にあります。";

}

if(step===2){

stepText="STEP2";

msg=
"円周は正多角形の周長より長い。";

}

if(step===3){

stepText="STEP3";

msg=
"nを変えてどの正多角形が使えそうか探そう。";

}

if(step===4){

stepText="STEP4";

msg=
"赤い辺が分かれば周長が分かりそうだ。";

}

if(step===5){

stepText="STEP5";

msg=
`
OA=OB=1

<br><br>

中心角 = ${(360/n).toFixed(1)}°
`;
}

if(step===6){

stepText="STEP6";

msg=
`
辺が

1,1,s

の三角形になった。

<br><br>

どんな公式が使えそう？
`;
}

if(step===7){

stepText="STEP7";

msg=
`
探索結果

<br><br>

π > ${lower.toFixed(4)}

`;

if(lower>3.05){

msg+=
"<br><br><div class='success'>Mission A候補！</div>";
}

}
}

if(mode==="outer"){

let r=R;

let pts=[];

for(let i=0;i<n;i++){

let t=
-Math.PI/2+
2*Math.PI*i/n;

let rr=
r/Math.cos(Math.PI/n);

pts.push({

x:cx+rr*Math.cos(t),
y:cy+rr*Math.sin(t)

});
}

ctx.beginPath();

ctx.moveTo(pts[0].x,pts[0].y);

for(let i=1;i<n;i++){

ctx.lineTo(
pts[i].x,
pts[i].y
);

}

ctx.closePath();

ctx.strokeStyle="purple";
ctx.lineWidth=2;
ctx.stroke();

const upper=
n*Math.tan(Math.PI/n);

if(step===1){

stepText="STEP1";

msg=
"正多角形は円の外側にあります。";

}

if(step===2){

stepText="STEP2";

msg=
"円周は正多角形の周長より短い。";

}

if(step===3){

stepText="STEP3";

msg=
"nを変えて使えそうな正多角形を探そう。";

}

if(step===4){

stepText="STEP4";

msg=
"辺の長さは直角三角形で求められそう。";

}

if(step===5){

stepText="STEP5";

msg=
`
中心角の半分は

${(180/n).toFixed(1)}°

`;

}

if(step===6){

stepText="STEP6";

msg=
`
15°になるのは

何角形だろう？
`;

}

if(step===7){

stepText="STEP7";

msg=
`
探索結果

<br><br>

π < ${upper.toFixed(4)}
`;

if(upper<3.25){

msg+=
"<br><br><div class='success'>Mission B候補！</div>";
}

}
}

document.getElementById("stepLabel")
.innerHTML=stepText;

document.getElementById("message")
.innerHTML=msg;

}

draw();

</script>

</body>
</html>
